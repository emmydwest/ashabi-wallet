name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (tests + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            contract
            factory
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Vault contract tests
        working-directory: contract
        run: cargo test
      - name: Factory tests
        working-directory: factory
        run: cargo test
      - name: Build the vault wasm
        working-directory: contract
        run: cargo near build non-reproducible-wasm
      - name: Build the factory wasm
        working-directory: factory
        run: cargo near build non-reproducible-wasm

  dashboard:
    name: Dashboard (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: SDK
        working-directory: packages/sdk
        run: npm ci && npm run typecheck && npm run build
      - name: MCP server
        working-directory: packages/mcp-server
        run: npm ci && npm run typecheck && npm run build
      - name: Install
        working-directory: dashboard
        run: npm ci
      - name: Lint
        working-directory: dashboard
        run: npm run lint
      - name: Typecheck
        working-directory: dashboard
        run: npx tsc --noEmit
      - name: Build
        working-directory: dashboard
        run: npm run build
